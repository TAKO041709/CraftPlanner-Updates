name: Publish Craft Planner UI update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: craftplanner-ui-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified v2.2.50 UI package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             'https://github.com/${{ github.repository }}/releases/download/v2.2.50/CraftPlanner_UI_Update_v2.2.50.zip'             -o previous.zip
          echo '48327b46d22f7a472765816e743483a6293d464a972266b7abc9929f534010ff  previous.zip' | sha256sum -c -
      - name: Patch UI, regenerate hashes, and package v2.2.51
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          with zipfile.ZipFile('previous.zip') as z:
              contents = {name: z.read(name) for name in z.namelist()}
          manifest = json.loads(contents['manifest.json'])
          assert manifest['version'] == '2.2.50'
          for name, expected in manifest['sha256'].items():
              assert hashlib.sha256(contents[name]).hexdigest() == expected, f'Original hash mismatch: {name}'
          html = contents['index.html'].decode('utf-8')
          # Hide per-crime multiplier controls from the initial paint onward.
          # Keep the global toggle and all calculation/event logic unchanged.
          assert 'data-crime-toggle-15' in html, 'Per-crime button selector not found'
          assert html.count('</head>') == 1, 'Unexpected HTML head structure'
          hidden_css = '<style id="cp-hide-per-crime-multiplier">button[data-crime-toggle-15]{display:none !important;visibility:hidden !important}</style>'
          html = html.replace('</head>', hidden_css + '</head>', 1)
          assert html.count('cp-hide-per-crime-multiplier') == 1
          contents['index.html'] = html.encode('utf-8')
          manifest['version'] = '2.2.51'
          for name in manifest['sha256']:
              manifest['sha256'][name] = hashlib.sha256(contents[name]).hexdigest()
          contents['manifest.json'] = (json.dumps(manifest, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          out = Path('CraftPlanner_UI_Update_v2.2.51.zip')
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED) as z:
              for name, data in contents.items():
                  z.writestr(name, data)
          with zipfile.ZipFile(out) as z:
              m = json.loads(z.read('manifest.json'))
              assert m['version'] == '2.2.51'
              for name, digest in m['sha256'].items():
                  assert hashlib.sha256(z.read(name)).hexdigest() == digest
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          Path('release-sha256.txt').write_text(digest + '\n')
          print('New package SHA256:', digest)
          PY
      - name: Publish release and verify asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.2.51 >/dev/null 2>&1; then
            echo 'v2.2.51 already exists; refusing to overwrite it' >&2
            exit 1
          fi
          gh release create v2.2.51 CraftPlanner_UI_Update_v2.2.51.zip             --title 'Craft Planner UI v2.2.51'             --notes 'Fix: hide transient per-crime ×1.5 buttons while preserving global fine calculations.'             --latest
          gh release view v2.2.51 --json assets --jq '.assets[].name' | grep -Fx 'CraftPlanner_UI_Update_v2.2.51.zip'
      - name: Update automatic updater metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('latest-ui.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data['version'] == '2.2.50', 'Latest version changed; inspect before publishing'
          data['version']='2.2.51'
          data['url']='https://github.com/${{ github.repository }}/releases/download/v2.2.51/CraftPlanner_UI_Update_v2.2.51.zip'
          data['sha256']=Path('release-sha256.txt').read_text().strip()
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest-ui.json
          git commit -m 'Publish Craft Planner UI v2.2.51'
          git push
