name: Publish Craft Planner UI update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: craftplanner-ui-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified v2.2.46 UI package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             'https://github.com/${{ github.repository }}/releases/download/v2.2.46/CraftPlanner_UI_Update_v2.2.46.zip'             -o previous.zip
          echo '20870a94e8cf74d84b747b15d128d8003db2d2bef9df73c92b54d052b2eb1584  previous.zip' | sha256sum -c -
      - name: Patch UI, regenerate hashes, and package v2.2.47
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          with zipfile.ZipFile('previous.zip') as z:
              contents = {name: z.read(name) for name in z.namelist()}
          manifest = json.loads(contents['manifest.json'])
          assert manifest['version'] == '2.2.46'
          for name, expected in manifest['sha256'].items():
              assert hashlib.sha256(contents[name]).hexdigest() == expected, f'Original hash mismatch: {name}'
          html = contents['index.html'].decode('utf-8')
          old = 'style="background:${crimeListMultiplier.has(x.id)?\'#28764e\':\'#293b52\'};border:1px solid #6687aa"'
          new = 'class="${crimeListMultiplier.has(x.id)?\'crime-multiplier-on\':\'crime-multiplier-off\'}"'
          assert html.count(old) == 1, 'Unexpected multiplier button markup'
          html = html.replace(old, new)
          anchor = '#crimeMultiplier[aria-pressed="true"]'
          assert html.count(anchor) == 1
          css = """button[data-crime-toggle-15].crime-multiplier-off{background:#293b52;color:#dce6f2;border:1px solid #52657a;box-shadow:none;filter:none;text-shadow:none}
          button[data-crime-toggle-15].crime-multiplier-on{background:#28764e;color:#fff;border:1px solid #54d99a;box-shadow:0 0 12px rgba(74,220,144,.4)}
          button[data-crime-toggle-15].crime-multiplier-off:hover{box-shadow:none;filter:none;text-shadow:none}
          """
          html = html.replace(anchor, css + anchor, 1)
          contents['index.html'] = html.encode('utf-8')
          manifest['version'] = '2.2.47'
          for name in manifest['sha256']:
              manifest['sha256'][name] = hashlib.sha256(contents[name]).hexdigest()
          contents['manifest.json'] = (json.dumps(manifest, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          out = Path('CraftPlanner_UI_Update_v2.2.47.zip')
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED) as z:
              for name, data in contents.items():
                  z.writestr(name, data)
          with zipfile.ZipFile(out) as z:
              m = json.loads(z.read('manifest.json'))
              assert m['version'] == '2.2.47'
              for name, digest in m['sha256'].items():
                  assert hashlib.sha256(z.read(name)).hexdigest() == digest
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          Path('release-sha256.txt').write_text(digest + '\n')
          print('New package SHA256:', digest)
          PY
      - name: Publish release and verify asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.2.47 >/dev/null 2>&1; then
            echo 'v2.2.47 already exists; refusing to overwrite it' >&2
            exit 1
          fi
          gh release create v2.2.47 CraftPlanner_UI_Update_v2.2.47.zip             --title 'Craft Planner UI v2.2.47'             --notes 'Fix: crime list ×1.5 button no longer glows when OFF.'             --latest
          gh release view v2.2.47 --json assets --jq '.assets[].name' | grep -Fx 'CraftPlanner_UI_Update_v2.2.47.zip'
      - name: Update automatic updater metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('latest-ui.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data['version'] == '2.2.46', 'Latest version changed; inspect before publishing'
          data['version']='2.2.47'
          data['url']='https://github.com/${{ github.repository }}/releases/download/v2.2.47/CraftPlanner_UI_Update_v2.2.47.zip'
          data['sha256']=Path('release-sha256.txt').read_text().strip()
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest-ui.json
          git commit -m 'Publish Craft Planner UI v2.2.47'
          git push
